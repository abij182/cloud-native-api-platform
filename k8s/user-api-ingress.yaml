apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-api-ingress
  namespace: default
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: user-api
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: user-api
                port:
                  number: 8000
